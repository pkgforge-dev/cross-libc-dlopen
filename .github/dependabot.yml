# Dependabot, for the GitHub Actions the workflows use.
#
# Every action in .github/workflows/ is pinned to a COMMIT, not a tag, because
# a tag moves and a moved tag runs code nobody reviewed. Dependabot understands
# that pinning: it opens a pull request that bumps the commit and updates the
# trailing `# vN` comment, which is a reviewable diff rather than a silent
# change under a tag that stayed the same.
#
# There is no other ecosystem here. The C has no package manager, the Python is
# stdlib-only, and the container images are plain distribution tags whose whole
# purpose is to be old.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
