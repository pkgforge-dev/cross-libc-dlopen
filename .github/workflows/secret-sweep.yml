# What must never be published. Pairs with scripts/common/check-no-secrets.sh
# in the template.
#
# ⚠ On this repository the sweep's "an email address" and "a long hex
# identifier" categories fire on things that are not secrets: one deliberate
# fixture on a reserved domain, git commit SHAs in citations, and the sha256
# pins on the two demo AppImages. Those pins are the point -- see
# scripts/suite-lib.sh -- and removing them to quiet a check would delete the
# thing that makes a download trustworthy. Red on every run, including every
# bot pull request, is a signal nobody reads.
#
# ⛔ The check ships from the template, so it cannot be narrowed at source. It
# is narrowed at the CALL SITE, in scripts/sweep-known-benign.sh, by name --
# and every other category stays fatal, including one nobody has thought of.
# ⭐ That is not asserted, it is proven on every run: the step below plants a
# category the narrowing has never been told about and requires a refusal
# before the real sweep is allowed to mean anything.
#
# ⛔ A real finding is REPORTED, never fixed silently. Rotation is the
# operator's, it comes first, and a history rewrite does not un-publish
# anything.

name: secret-sweep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: fetch the check
        run: |
          curl -fsSL -o /tmp/check-no-secrets.sh \
            https://raw.githubusercontent.com/Azathothas/TEMPLATE/main/scripts/common/check-no-secrets.sh

      # ⭐ Both halves, and this is the planted one. A narrowing that cannot
      # refuse is a narrowing that switched the check off, and the difference
      # is invisible from a green run.
      - name: the narrowing still refuses a category it was not told about
        run: |
          # ⛔ ASSEMBLED AT RUNTIME. Spelled out plainly the literal would sit
          # in this file, the sweep would find it on every REAL run, and the
          # job would be red for ever -- which is the defect this step exists
          # to catch, reproduced one level up. Two gates in this repository
          # were exactly that; scripts/verify-gates.sh carries the same note.
          plant=.github/_sweep_probe.txt
          printf '%s%s\n' 'AKIA' '0123456789ABCDEF' > "$plant"
          # ⚠ `|| rc=$?`, not a bare call followed by `rc=$?`. GitHub runs
          # every `run:` block under `bash -e`, so a command that exits
          # non-zero aborts the step THERE -- and this step's whole purpose is
          # to run something that must exit non-zero. The bare form failed the
          # job before it could read the code it was written to read.
          rc=0
          sh scripts/sweep-known-benign.sh /tmp/check-no-secrets.sh >/tmp/planted.out 2>&1 || rc=$?
          rm -f "$plant"
          sed 's/^/  /' /tmp/planted.out
          if [ "$rc" -eq 0 ]; then
            echo "the narrowing accepted a planted aws access key id: it is decorative"
            exit 1
          fi
          echo "ok: an unmeasured category is still fatal (exit $rc)"

      # ⛔ Unpiped, so the narrowing's own exit code is this step's exit code.
      - name: sweep
        run: sh scripts/sweep-known-benign.sh /tmp/check-no-secrets.sh
