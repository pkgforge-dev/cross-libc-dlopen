# What must never be published. Pairs with scripts/common/check-no-secrets.sh
# in the template.
#
# ⚠ On this repository the sweep's "long hex identifier" category fires on
# things that are not secrets: git commit SHAs in citations, and the sha256
# pins on the two demo AppImages. Those pins are the point -- see
# scripts/suite-lib.sh -- and removing them to quiet a check would delete the
# thing that makes a download trustworthy.
#
# ⛔ A real finding is REPORTED, never fixed silently. Rotation is the
# operator's, it comes first, and a history rewrite does not un-publish
# anything.

name: secret-sweep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: fetch the check
        run: |
          curl -fsSL -o /tmp/check-no-secrets.sh \
            https://raw.githubusercontent.com/Azathothas/TEMPLATE/main/scripts/common/check-no-secrets.sh

      # Unpiped, so the check's own exit code is this step's exit code.
      - name: sweep
        run: sh /tmp/check-no-secrets.sh --public
